<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A.BROW × PICKLE 합동 비서실</title>
<meta name="description" content="에이브로우 뷰티 스튜디오의 피클 합동 비서실 — 오피스 맵, 실시간 합동 채팅, 공동 할 일 보드" />
<meta property="og:title" content="A.BROW × PICKLE 합동 비서실" />
<meta property="og:description" content="천안 에이브로우 스튜디오의 피클 합동 비서실" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F8C8DC'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='sans-serif' fill='%237A2E43'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink-050:#FFF7FA;
    --pink-100:#FDE8F0;
    --pink-200:#F8C8DC;
    --pink-300:#F3AFCB;
    --rose:#D96A91;
    --rose-deep:#B3486A;
    --wine:#7A2E43;
    --ink:#4A2A35;
    --muted:#9A7C87;
    --line:#F2D6E1;
    --white:#FFFFFF;
    --ok:#3FA87A;
    --warn:#C98A21;
    --shadow:0 8px 24px rgba(179,72,106,.10), 0 1px 3px rgba(179,72,106,.06);
    --shadow-sm:0 2px 8px rgba(179,72,106,.08);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 100% -10%, #FFEFF6 0%, rgba(255,239,246,0) 60%),
      radial-gradient(900px 400px at -10% 10%, #FDE8F0 0%, rgba(253,232,240,0) 55%),
      linear-gradient(180deg,#FFF9FB 0%, #FDE8F0 100%);
    min-height:100vh;
    font-size:15px;
    line-height:1.55;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:18px 16px 90px}

  /* header */
  header.top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(135deg,#FFFFFF 0%,#FFF6FA 100%);
    border:1px solid var(--line);border-radius:26px;padding:16px 20px;
    box-shadow:var(--shadow);
  }
  .logo{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
  }
  .logo .mark{
    width:46px;height:46px;border-radius:15px;
    background:linear-gradient(140deg,var(--pink-200),#FFFFFF 70%);
    border:1px solid var(--pink-300);
    display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:20px;color:var(--wine);
    letter-spacing:.5px;
  }
  .logo h1{
    font-family:'Jua',sans-serif;font-weight:400;font-size:21px;margin:0;color:var(--wine);
    letter-spacing:-.2px;
  }
  .logo p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;
    padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(63,168,122,.15)}
  .dot.off{background:#D88A8A}
  .dot.wait{background:var(--warn);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* tab bar (mobile) */
  nav.tabs{
    position:sticky;top:8px;z-index:30;display:none;gap:6px;margin:14px 0 0;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow-sm);
  }
  nav.tabs button{
    flex:1;border:0;background:transparent;font-family:inherit;font-size:13.5px;color:var(--muted);
    padding:9px 6px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  nav.tabs button.active{background:linear-gradient(140deg,var(--pink-200),#FFE9F2);color:var(--wine);font-weight:700}

  main.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:16px;margin-top:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}

  section.card{
    background:linear-gradient(180deg,#FFFFFF 0%,#FFFCFD 100%);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;gap:8px;padding:14px 16px 10px;flex-wrap:wrap;
  }
  .card-head h2{
    font-family:'Jua',sans-serif;font-weight:400;font-size:16.5px;margin:0;color:var(--wine);
    display:flex;align-items:center;gap:7px;
  }
  .card-head .sub{font-size:11.5px;color:var(--muted)}
  .card-head .spacer{margin-left:auto}
  .btn{
    border:1px solid var(--pink-300);background:#fff;color:var(--rose-deep);
    font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--pink-100)}
  .btn.solid{background:linear-gradient(140deg,var(--rose),var(--rose-deep));color:#fff;border-color:transparent;font-weight:700}
  .btn.solid:hover{filter:brightness(1.05)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
  .card-body{padding:0 16px 16px}

  /* office map */
  .map{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;
  }
  .zone{
    position:relative;min-height:128px;border-radius:16px;padding:10px 11px 12px;
    background:
      linear-gradient(180deg,rgba(253,232,240,.5),rgba(255,255,255,.9)),
      repeating-linear-gradient(90deg,rgba(243,175,203,.18) 0 1px,transparent 1px 22px);
    border:1.5px dashed var(--pink-300);
    transition:.18s;
  }
  .zone:hover{border-color:var(--rose);background-color:#FFF6FA}
  .zone.treatment{grid-column:span 2;min-height:118px}
  .zone-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--wine);font-weight:700}
  .zone-label em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:400}
  .zone-floor{
    position:absolute;left:11px;bottom:8px;font-size:9.5px;color:#C69BAD;letter-spacing:.6px;
  }
  .people{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .person{
    display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:5px 10px 5px 5px;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:.15s;max-width:100%;
  }
  .person:hover{transform:translateY(-1px);border-color:var(--pink-300)}
  .person.empty{border-style:dashed;background:rgba(255,255,255,.55);color:var(--muted);box-shadow:none;padding:6px 10px;font-size:12px}
  .avatar{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;
    border:1.5px solid #fff;box-shadow:0 0 0 1.5px var(--pink-200);
    background:linear-gradient(140deg,#FFE3EE,#F8C8DC);
  }
  .person .who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .person .name{font-size:12.5px;font-weight:700;color:var(--wine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person .st{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
  .st-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ok)}
  .st-휴게,.st-외출,.st-자리비움{background:#C9B4BD}
  .st-작업중,.st-시술중{background:var(--warn)}
  .st-상담중,.st-회의중{background:#7FA9D6}
  .me-badge{font-size:9.5px;color:var(--rose-deep);background:var(--pink-100);border-radius:6px;padding:0 4px;margin-left:2px}

  /* chat */
  #chatCard{display:flex;flex-direction:column;min-height:520px}
  .chat-box{display:flex;flex-direction:column;height:100%;min-height:0}
  .messages{
    flex:1;overflow-y:auto;padding:6px 14px 8px;display:flex;flex-direction:column;gap:10px;
    max-height:min(52vh,470px);scroll-behavior:smooth;
  }
  .msg{display:flex;gap:8px;align-items:flex-start;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg .bubble{
    background:#FFF6FA;border:1px solid var(--line);border-radius:14px;padding:8px 11px;
    font-size:13.5px;max-width:100%;word-break:break-word;white-space:pre-wrap;
  }
  .msg.mine{flex-direction:row-reverse}
  .msg.mine .bubble{background:linear-gradient(140deg,#FDE8F0,#FBD9E6);border-color:var(--pink-300)}
  .msg.mentioned .bubble{border-color:var(--rose);box-shadow:0 0 0 3px rgba(217,106,145,.12)}
  .msg .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:2px}
  .msg .meta b{color:var(--wine);font-size:12px}
  .mention{background:var(--pink-100);color:var(--rose-deep);border-radius:6px;padding:0 4px;font-weight:700}
  .chat-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 10px}

  .composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:#fff;position:relative}
  .who-pick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .who-pick button{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-family:inherit;
    font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;
  }
  .who-pick button.active{background:linear-gradient(140deg,var(--pink-200),#FFE9F2);border-color:var(--pink-300);color:var(--wine);font-weight:700}
  .input-row{display:flex;gap:8px;align-items:flex-end}
  textarea#msgInput{
    flex:1;resize:none;border:1px solid var(--line);border-radius:16px;padding:10px 13px;
    font-family:inherit;font-size:13.5px;line-height:1.45;max-height:120px;background:#FFFCFD;color:var(--ink);
    outline:none;transition:.15s;
  }
  textarea#msgInput:focus{border-color:var(--rose);background:#fff}
  .send{
    width:42px;height:42px;border-radius:50%;border:0;flex:none;cursor:pointer;
    background:linear-gradient(140deg,var(--rose),var(--rose-deep));color:#fff;font-size:17px;
    box-shadow:0 4px 12px rgba(179,72,106,.3);transition:.15s;
  }
  .send:active{transform:scale(.94)}
  .mentions{
    position:absolute;bottom:calc(100% - 4px);left:12px;right:12px;background:#fff;border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;max-height:190px;overflow:auto;z-index:20;
  }
  .mentions.show{display:block}
  .mentions button{
    display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;font-family:inherit;
    padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink);text-align:left;
  }
  .mentions button:hover,.mentions button.sel{background:var(--pink-100)}
  .mentions small{color:var(--muted)}

  /* board */
  .add-row{display:flex;gap:7px;margin:2px 0 12px;flex-wrap:wrap}
  .add-row input[type=text],.add-row select{
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13px;
    background:#FFFCFD;color:var(--ink);outline:none;min-width:0;
  }
  .add-row input[type=text]:focus{border-color:var(--rose);background:#fff}
  .add-row input.grow{flex:1}
  .todolist{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto;padding-right:2px}
  .todo{
    display:flex;gap:9px;align-items:flex-start;background:#FFFBFD;border:1px solid var(--line);
    border-radius:13px;padding:9px 11px;
  }
  .todo.done{opacity:.55;background:#FAF6F8}
  .check{
    width:20px;height:20px;border-radius:7px;border:1.6px solid var(--pink-300);background:#fff;flex:none;
    cursor:pointer;display:grid;place-items:center;font-size:12px;color:transparent;margin-top:1px;transition:.15s;
  }
  .todo.done .check{background:var(--rose);border-color:var(--rose);color:#fff}
  .todo .txt{flex:1;font-size:13.5px;word-break:break-word}
  .todo.done .txt{text-decoration:line-through;text-decoration-color:var(--rose)}
  .todo .by{font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .tag{font-size:10px;background:var(--pink-100);color:var(--rose-deep);border-radius:6px;padding:1px 6px}
  .del{border:0;background:transparent;color:#D9B7C3;cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .del:hover{color:var(--rose-deep)}
  .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-top:2px}
  .note{
    position:relative;background:#FFF3F8;border:1px solid var(--line);border-radius:13px;padding:11px 12px 9px;
    font-size:12.5px;min-height:82px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm);
  }
  .note:nth-child(3n){background:#FFF7FA;transform:rotate(-.6deg)}
  .note:nth-child(3n+1){background:#FFF1F6;transform:rotate(.5deg)}
  .note .who{display:block;font-size:10px;color:var(--muted);margin-top:8px}
  .note .del{position:absolute;top:6px;right:8px}
  .empty{color:var(--muted);font-size:12px;padding:10px 2px}

  /* modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(74,42,53,.32);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:80;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:#fff;border-radius:22px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(122,46,67,.25);
  }
  .modal h3{font-family:'Jua',sans-serif;font-weight:400;margin:0 0 3px;color:var(--wine);font-size:17px}
  .modal p.hint{margin:0 0 14px;font-size:12px;color:var(--muted)}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select{
    width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-family:inherit;font-size:13.5px;
    background:#FFFCFD;color:var(--ink);outline:none;
  }
  .modal input:focus{border-color:var(--rose)}
  .modal .actions{display:flex;gap:8px;margin-top:18px}
  .modal .actions button{flex:1;padding:10px;border-radius:12px;font-family:inherit;font-size:13.5px;cursor:pointer}
  .modal .actions .cancel{border:1px solid var(--line);background:#fff;color:var(--muted)}
  .modal .actions .ok{border:0;background:linear-gradient(140deg,var(--rose),var(--rose-deep));color:#fff;font-weight:700}

  .notice{
    margin-top:14px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6;
  }
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:rgba(74,42,53,.92);color:#fff;font-size:12.5px;padding:10px 16px;border-radius:999px;
    transition:.25s;z-index:90;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:980px){
    .wrap{padding:12px 12px 78px}
    nav.tabs{display:flex}
    main.grid{grid-template-columns:1fr;margin-top:12px}
    main.grid .col{display:contents}
    section.card[data-view]{display:none}
    section.card[data-view].active{display:block}
    .messages{max-height:none;height:46vh}
    #chatCard{min-height:0}
    .logo h1{font-size:18px}
    .zone{min-height:112px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="./">
      <span class="mark">A.</span>
      <span>
        <h1>A.BROW 합동 비서실</h1>
        <p>PICKLE OFFICE · 천안 뷰티 스튜디오</p>
      </span>
    </a>
    <div class="top-right">
      <span class="pill" id="connPill"><span class="dot wait" id="connDot"></span><span id="connText">연결 중…</span></span>
      <span class="pill">👥 <b id="memberCount">0</b>명 근무 중</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="office" class="active">🏠 오피스</button>
    <button data-tab="chat">💬 채팅</button>
    <button data-tab="board">📋 보드</button>
  </nav>

  <main class="grid">
    <div class="col">
      <!-- OFFICE MAP -->
      <section class="card" data-view="office">
        <div class="card-head">
          <h2>🏠 스튜디오 오피스</h2>
          <span class="sub">피클을 눌러 위치·상태 바꾸기</span>
          <span class="spacer"></span>
          <button class="btn" id="inviteBtn">＋ 피클 초대</button>
        </div>
        <div class="card-body">
          <div class="map" id="map"></div>
        </div>
      </section>

      <!-- BOARD -->
      <section class="card" data-view="board">
        <div class="card-head">
          <h2>📋 공동 할 일</h2>
          <span class="sub">함께 처리하고 체크</span>
        </div>
        <div class="card-body">
          <div class="add-row">
            <input type="text" class="grow" id="todoInput" placeholder="예) 내일 10시 리터치 고객 컨펌 문자 보내기" maxlength="140" />
            <select id="todoAssignee" aria-label="담당">
              <option value="">담당 없음</option>
            </select>
            <button class="btn solid" id="todoAdd">추가</button>
          </div>
          <div class="todolist" id="todolist"></div>
        </div>
      </section>

      <section class="card" data-view="board">
        <div class="card-head">
          <h2>🗒️ 메모 보드</h2>
          <span class="sub">샵 운영 메모 · 아이디어</span>
        </div>
        <div class="card-body">
          <div class="add-row">
            <input type="text" class="grow" id="noteInput" placeholder="짧은 메모 (예: 12월 프로모션 문구 초안)" maxlength="160" />
            <button class="btn solid" id="noteAdd">붙이기</button>
          </div>
          <div class="notes" id="notes"></div>
        </div>
      </section>
    </div>

    <div class="col">
      <!-- CHAT -->
      <section class="card" data-view="chat" id="chatCard">
        <div class="card-head">
          <h2>💬 합동 채팅</h2>
          <span class="sub"><b>@이름</b> 으로 일 시키기</span>
          <span class="spacer"></span>
          <span class="pill" id="mentionPill" style="display:none">📣 내 멘션 <b id="mentionCount">0</b></span>
        </div>
        <div class="chat-box">
          <div class="messages" id="messages"></div>
          <div class="composer">
            <div class="mentions" id="mentionBox"></div>
            <div class="who-pick" id="whoPick"></div>
            <div class="input-row">
              <textarea id="msgInput" rows="1" placeholder="@피치 처럼 멘션해서 지시해 보세요"></textarea>
              <button class="send" id="sendBtn" aria-label="보내기">↑</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <p class="notice">
    공개 페이지예요 · 전화번호·주소·비밀번호 같은 민감한 정보는 적지 마세요 🔒<br />
    A.BROW × PICKLE · made for @sea_0422
  </p>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   A.BROW × PICKLE 합동 비서실
   단일 파일 웹앱 (빌드 없음)
   ========================================================= */

/* ---------- 설정 ---------- */
const CONFIG = {
  // 'ntfy'  : 무인증 공개 pub/sub (지금 바로 동작) — 실시간 SSE + 12시간 보관

/* ---------- 백엔드 (실시간 동기화) ---------- */
const backend = {
  publish(op) {
    if (CONFIG.backend === 'firebase' && CONFIG.firebaseUrl) return this.fbPublish(op);
    return this.ntfyPublish(op);
  },
  async ntfyPublish(op) {
    const res = await fetch('https://ntfy.sh/' + CONFIG.ntfyTopic, {
      method: 'POST', body: JSON.stringify(op), cache: 'no-store',
      headers: { 'Content-Type': 'text/plain' }
    });
    if (!res.ok) throw new Error('publish ' + res.status);
    return res.text();
  },
  async fbPublish(op) {
    const res = await fetch(CONFIG.firebaseUrl + '/ops.json', {
      method: 'POST', body: JSON.stringify(op),
      headers: { 'Content-Type': 'application/json' }
    });
    if (!res.ok) throw new Error('fb publish ' + res.status);
    return res.text();
  },

  async loadBacklog() {
    if (CONFIG.backend === 'firebase' && CONFIG.firebaseUrl) {
      const res = await fetch(CONFIG.firebaseUrl + '/ops.json');
      const data = await res.json() || {};
      return Object.values(data).filter(Boolean);
    }
    const res = await fetch('https://ntfy.sh/' + CONFIG.ntfyTopic + '/json?poll=1&since=all', { cache: 'no-store' });
    const text = await res.text();
    const out = [];
    text.split('\n').forEach((line) => {
      line = line.trim(); if (!line) return;
      try { const j = JSON.parse(line); if (j.event === 'message' && j.message) out.push(JSON.parse(j.message)); } catch (e) {}
    });
    return out;
  },

  listen(onOp) {
    if (CONFIG.backend === 'firebase' && CONFIG.firebaseUrl) {
      // RTDB REST 스트리밍
      const es = new EventSource(CONFIG.firebaseUrl + '/ops.json');
      es.addEventListener('put', (e) => {
        try {
          const d = JSON.parse(e.data);
          const v = d.data;
          if (v && typeof v === 'object') Object.values(v).forEach((op) => op && onOp(op));
        } catch (err) {}
      });
      es.onopen = () => setConnected(true);
      es.onerror = () => setConnected(false);
      return es;
    }
    const es = new EventSource('https://ntfy.sh/' + CONFIG.ntfyTopic + '/sse');
    es.onopen = () => setConnected(true);
    es.onerror = () => setConnected(false);
    es.onmessage = (e) => {
      setConnected(true);
      try {
        const j = JSON.parse(e.data);
        if (j.event === 'message' && j.message) onOp(JSON.parse(j.message));
      } catch (err) {}
    };
    return es;
  }
};

function setConnected(v) {
  if (state.connected === v) return;
  state.connected = v;
  const dot = $('#connDot'), txt = $('#connText');
  dot.className = 'dot ' + (v ? 'on' : 'off');
  txt.textContent = v ? '실시간 연결됨' : '오프라인 · 재연결 중';
}

/* ---------- 상태 적용 ---------- */
function applyOp(op) {
  if (!op || !op.id || state.applied.has(op.id)) return false;
  state.applied.add(op.id);
  switch (op.t) {
    case 'chat':
      state.messages.push(op.m);
      state.messages.sort((a, b) => (a.ts || 0) - (b.ts || 0));
      break;
    case 'todo.add':
      if (!state.todos.some((t) => t.id === op.todo.id)) state.todos.push(op.todo);
      break;
    case 'todo.toggle': {
      const t = state.todos.find((x) => x.id === op.tid); if (t) t.done = !!op.done;
      break;
    }
    case 'todo.del':
      state.todos = state.todos.filter((x) => x.id !== op.tid);
      break;
    case 'note.add':
      if (!state.notes.some((n) => n.id === op.note.id)) state.notes.push(op.note);
      break;
    case 'note.del':
      state.notes = state.notes.filter((x) => x.id !== op.nid);
      break;
    case 'presence': {
      const m = state.members[op.mid];
      if (m) { if (op.zone) m.zone = op.zone; if (op.status) m.status = op.status; }
      break;
    }
    case 'member.add':
      if (op.member && !state.members[op.member.id]) {
        state.members[op.member.id] = op.member;
        state.order.push(op.member.id);
      }
      break;
    default:
      return false;
  }
  save();
  return true;
}

function save() {
  try {
    localStorage.setItem(CONFIG.storeKey, JSON.stringify({
      members: state.members, order: state.order, messages: state.messages,
      todos: state.todos, notes: state.notes,
      applied: Array.from(state.applied).slice(-500)
    }));
  } catch (e) {}
}

function restore() {
  try {
    const raw = localStorage.getItem(CONFIG.storeKey);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.members || !Object.keys(d.members).length) return false;
    state.members = d.members;
    state.order = d.order || Object.keys(d.members);
    state.messages = d.messages || [];
    state.todos = d.todos || [];
    state.notes = d.notes || [];
    (d.applied || []).forEach((id) => state.applied.add(id));
    return true;
  } catch (e) { return false; }
}

function seed() {
  SEED_MEMBERS.forEach((m) => { if (!state.members[m.id]) { state.members[m.id] = { ...m }; state.order.push(m.id); } });
}

/* ---------- 렌더: 멤버 ---------- */
function memberList() { return state.order.map((id) => state.members[id]).filter(Boolean); }
function memberByHandle(h) { return memberList().find((m) => m.handle === h); }

function avatarOf(m) {
  const colors = ['#FFE3EE', '#FDE8F0', '#FFDCE8', '#FFF0F6', '#FCE1EA'];
  const c = colors[(m.id || '').charCodeAt(0) % colors.length];
  return `<span class="avatar" style="background:linear-gradient(140deg,#fff,${c})">${m.emoji || '🌷'}</span>`;
}

function statusClass(s) { return 'st-' + String(s || '').replace(/\s/g, ''); }

        <div class="people">${inZone}</div>

  map.querySelectorAll('.person[data-mid]').forEach((el) => {

      openPresenceModal(state.me, zone.dataset.zone);

}

/* ---------- 렌더: 채팅 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function linkify(text) {
  return esc(text).replace(/@[가-힣A-Za-z0-9_]+/g, (m) => `<span class="mention">${m}</span>`);
}
function fmtTime(ts) {
  const d = new Date(ts || Date.now());
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function renderChat() {
  const box = $('#messages');
  if (!state.messages.length) {
    box.innerHTML = '<div class="chat-empty">아직 대화가 없어요. @피치 처럼 멘션해서 첫 지시를 내려 보세요 💌</div>';
  } else {
    const myHandle = (state.members[state.me] || {}).handle;
    box.innerHTML = state.messages.slice(-120).map((m) => {
      const who = state.members[m.who] || { name: '알 수 없음', emoji: '❔', handle: '' };
      const mentioned = myHandle && m.text.includes(myHandle);
      return `
        <div class="msg ${m.who === state.me ? 'mine' : ''} ${mentioned ? 'mentioned' : ''}">
          ${avatarOf(who)}
          <div>
            <div class="meta"><b>${esc(who.name)}</b> <span>${esc(who.handle || '')}</span> <span>· ${fmtTime(m.ts)}</span></div>
            <div class="bubble">${linkify(m.text)}</div>
          </div>
        </div>`;
    }).join('');
  }
  box.scrollTop = box.scrollHeight;

  const myHandle = (state.members[state.me] || {}).handle;
  const n = myHandle ? state.messages.filter((m) => m.who !== state.me && m.text.includes(myHandle)).length : 0;
  $('#mentionPill').style.display = n ? 'inline-flex' : 'none';
  $('#mentionCount').textContent = n;

  // 발신자 선택
  const pick = $('#whoPick');
  pick.innerHTML = memberList().map((m) =>
    `<button data-me="${m.id}" class="${m.id === state.me ? 'active' : ''}">${m.emoji} ${esc(m.name)}</button>`
  ).join('');
  pick.querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => {
      state.me = b.dataset.me;
      localStorage.setItem(CONFIG.storeKey + '_me', state.me);
      renderAll();
    });
  });
}

/* ---------- 렌더: 보드 ---------- */
function renderTodos() {
  const list = $('#todolist');
  if (!state.todos.length) { list.innerHTML = '<div class="empty">할 일이 없어요. 첫 업무를 등록해 보세요.</div>'; }
  else {
    list.innerHTML = state.todos.map((t) => {
      const by = state.members[t.by] || { name: '알 수 없음' };
      const as = t.assignee ? (state.members[t.assignee] || {}).name : '';
      return `
        <div class="todo ${t.done ? 'done' : ''}" data-tid="${t.id}">
          <button class="check" data-act="toggle" aria-label="완료 체크">✓</button>
          <div class="txt">${esc(t.text)}
            <div class="by">${esc(by.name)} 등록${as ? ` · <span class="tag">@${esc(as)}</span>` : ''}</div>
          </div>
          <button class="del" data-act="del" aria-label="삭제">×</button>
        </div>`;
    }).join('');
    list.querySelectorAll('[data-act]').forEach((b) => {
      b.addEventListener('click', (e) => {
        const row = e.target.closest('.todo');
        const t = state.todos.find((x) => x.id === row.dataset.tid);
        if (!t) return;
        if (b.dataset.act === 'toggle') publish({ t: 'todo.toggle', tid: t.id, done: !t.done });
        else publish({ t: 'todo.del', tid: t.id });
      });
    });
  }

  const sel = $('#todoAssignee');
  const cur = sel.value;
  sel.innerHTML = '<option value="">담당 없음</option>' +
    memberList().map((m) => `<option value="${m.id}">@${esc(m.name)}</option>`).join('');
  if (cur) sel.value = cur;
}

function renderNotes() {
  const box = $('#notes');
  if (!state.notes.length) { box.innerHTML = '<div class="empty">메모가 없어요.</div>'; return; }
  box.innerHTML = state.notes.map((n) => {
    const by = state.members[n.by] || { name: '알 수 없음' };
    return `<div class="note" data-nid="${n.id}">${esc(n.text)}<span class="who">${esc(by.name)}</span><button class="del" data-act="del" aria-label="삭제">×</button></div>`;
  }).join('');
  box.querySelectorAll('[data-act=del]').forEach((b) => {
    b.addEventListener('click', (e) => {
      const id = e.target.closest('.note').dataset.nid;
      publish({ t: 'note.del', nid: id });
    });
  });
}

function renderAll() { renderMap(); renderChat(); renderTodos(); renderNotes(); }

/* ---------- 발행 ---------- */
async function publish(op) {
  op.id = op.id || uid();
  op.ts = op.ts || Date.now();
  applyOp(op);
  renderAll();
  try {
    await backend.publish(op);
  } catch (err) {
    toast('저장 실패 — 잠시 후 다시 시도해 주세요');
    console.warn(err);
  }
}

/* ---------- 채팅 입력 + 멘션 자동완성 ---------- */
const msgInput = $('#msgInput');
let mentionIdx = 0, mentionQuery = '', mentionOpen = false;

function currentMention() {
  const val = msgInput.value;
  const pos = msgInput.selectionStart;
  const before = val.slice(0, pos);
  const m = before.match(/@([가-힣A-Za-z0-9_]*)$/);
  return m ? { q: m[1], start: pos - m[0].length, end: pos } : null;
}

function renderMentionBox() {
  const cur = currentMention();
  const box = $('#mentionBox');
  if (!cur) { box.classList.remove('show'); mentionOpen = false; return; }
  const list = memberList().filter((m) => m.handle.replace('@', '').includes(cur.q));
  if (!list.length) { box.classList.remove('show'); mentionOpen = false; return; }
  mentionEnderIdx = 0;
  box.innerHTML = list.map((m, i) =>
    `<button data-handle="${m.handle}" class="${i === mentionIdx ? 'sel' : ''}">${m.emoji} <b>${esc(m.name)}</b> <small>${esc(m.handle)} · ${esc(m.role || '')}</small></button>`
  ).join('');
  box.classList.add('show');
  mentionOpen = true;
  mentionList = list;
  box.querySelectorAll('button').forEach((b) => b.addEventListener('mousedown', (e) => {
    e.preventDefault(); insertMention(b.dataset.handle);
  }));
}
let mentionList = [], mentionEnderIdx = 0;

function insertMention(handle) {
  const cur = currentMention();
  if (!cur) return;
  const val = msgInput.value;
  msgInput.value = val.slice(0, cur.start) + handle + ' ' + val.slice(cur.end);
  const pos = cur.start + handle.length + 1;
  msgInput.setSelectionRange(pos, pos);
  msgInput.focus();
  $('#mentionBox').classList.remove('show');
  mentionOpen = false;
}

msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  mentionIdx = 0;
  renderMentionBox();
});
msgInput.addEventListener('keydown', (e) => {
  if (mentionOpen && mentionList.length) {
    if (e.key === 'ArrowDown') { e.preventDefault(); mentionIdx = (mentionIdx + 1) % mentionList.length; renderMentionBox(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); mentionIdx = (mentionIdx - 1 + mentionList.length) % mentionList.length; renderMentionBox(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); insertMention(mentionList[mentionIdx].handle); return; }
    if (e.key === 'Escape') { $('#mentionBox').classList.remove('show'); mentionOpen = false; return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  msgInput.style.height = 'auto';
  publish({ t: 'chat', m: { id: 'm' + uid(), who: state.me, text, ts: Date.now() } });
}

$('#sendBtn').addEventListener('click', sendMessage);

/* ---------- 보드 입력 ---------- */
$('#todoAdd').addEventListener('click', () => {
  const text = $('#todoInput').value.trim();
  if (!text) return;
  $('#todoInput').value = '';
  publish({ t: 'todo.add', todo: { id: 't' + uid(), text, by: state.me, assignee: $('#todoAssignee').value || null, done: false, ts: Date.now() } });
});
$('#todoInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#todoAdd').click(); });

$('#noteAdd').addEventListener('click', () => {
  const text = $('#noteInput').value.trim();
  if (!text) return;
  $('#noteInput').value = '';
  publish({ t: 'note.add', note: { id: 'n' + uid(), text, by: state.me, ts: Date.now() } });
});
$('#noteInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#noteAdd').click(); });

$('#inviteBtn').addEventListener('click', openInviteModal);

/* ---------- 탭 ---------- */
$$('#tabs button').forEach((b) => {
  b.addEventListener('click', () => {
    $$('#tabs button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    $$('section.card[data-view]').forEach((s) => s.classList.toggle('active', s.dataset.view === b.dataset.tab));
  });
});

/* ---------- 시작 ---------- */
async function boot() {
  const hadLocal = restore();
  seed();

  // 1) 서버 이벤트 로그 불러오기
  try {
    const ops = await backend.loadBacklog();
    ops.forEach((op) => applyOp(op));
  } catch (e) {
    console.warn('backlog failed', e);
  }

  // 2) 실시간 구독
  backend.listen((op) => { if (applyOp(op)) renderAll(); });
  setConnected(true);

  // 3) 처음 열린 공간이면 씨앗 데이터 심기 (1회)
  const seeded = localStorage.getItem(CONFIG.storeKey + '_seeded');
  if (!seeded && state.messages.length === 0 && state.todos.length === 0) {
    localStorage.setItem(CONFIG.storeKey + '_seeded', '1');
    for (const op of SEED_OPS) {
      op.ts = Date.now() - 60000;
      try { await backend.publish(op); } catch (e) {}
      applyOp(op);
    }
  }

  renderAll();
}

window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderAll(); });

chatBoot();
function chatBoot() {
  renderAll();
  boot();
}
</script>
</body>
</html>
